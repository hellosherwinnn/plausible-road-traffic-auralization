[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plausible-road-traffic-auralization"
version = "0.1.0"
description = "Public, anonymized framework for a SUMO-to-RAVEN/Pigeon road traffic auralization workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml>=5.0",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
